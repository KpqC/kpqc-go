name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: 1.22.x
          - os: ubuntu-24.04
            go: stable
          - os: ubuntu-24.04-arm
            go: stable
          - os: macos-15
            go: stable
          - os: macos-15-intel
            go: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        run: go test -race -count=1 ./...
      - name: Known-answer tests
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: >-
          go test -race -tags=kpqc_kat -count=1
          -run '^(TestKnownAnswerVectors|TestEntropyFailurePropagates)$' ./...
      - name: Vet
        run: go vet -tags=kpqc_kat ./...

  sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: AddressSanitizer
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: go test -asan -tags=kpqc_kat -count=1 ./...
      - name: UndefinedBehaviorSanitizer
        env:
          CGO_CFLAGS: -O1 -g -fsanitize=undefined -fno-sanitize-recover=undefined
          CGO_LDFLAGS: -fsanitize=undefined
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: go test -tags=kpqc_kat -count=1 ./...
